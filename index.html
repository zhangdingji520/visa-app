<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>AI签证行程单生成器</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --paper: #ffffff;
      --text: #1a202c;
      --text2: #4a5568;
      --muted: #718096;
      --border: #e2e8f0;
      --borderStrong: #cbd5e0;
      --accent: #2b6cb0;
      --accentLight: #ebf4ff;
      --accentDark: #1a4a7a;
      --danger: #c53030;
      --success: #2f855a;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --radius: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .app-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-icon { width:36px; height:36px; background:var(--accent); border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; }
    .logo h1 { font-size:1.2rem; font-weight:700; }
    .logo span { font-size:0.75rem; color:var(--muted); display:block; }
    .header-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn {
      display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:24px;
      font-size:0.85rem; font-weight:500; cursor:pointer; border:1px solid transparent;
      background:white; transition:0.2s; white-space:nowrap;
    }
    .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-primary:hover { background:var(--accentDark); }
    .btn-outline { border-color:var(--borderStrong); color:var(--text2); }
    .btn-outline:hover { background:var(--accentLight); border-color:var(--accent); }
    .btn-success { background:var(--success); color:#fff; }
    .btn-success:hover { background:#1e5a3a; }
    .btn-sm { padding:6px 14px; font-size:0.8rem; }
    .main-layout {
      display: flex; max-width:1400px; margin:0 auto; padding:20px 16px; gap:20px;
      flex-wrap: wrap;
    }
    .input-area {
      flex: 0 0 380px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
      padding:24px; border:1px solid var(--border); height: fit-content;
      position: sticky; top: 85px;
    }
    .preview-area {
      flex: 1; min-width: 0;
      display: flex; flex-direction:column; align-items:center; gap:16px;
    }
    @media (max-width:900px) {
      .main-layout { flex-direction:column; }
      .input-area { flex:auto; width:100%; position:static; }
      .preview-area { width:100%; }
    }
    .input-area h3 { font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items:center; gap:8px; }
    .form-row { margin-bottom: 16px; }
    .form-row label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      color: var(--text2); display: block; margin-bottom: 4px; letter-spacing: 0.5px;
    }
    .form-row textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--borderStrong);
      border-radius: 8px; font-size: 0.85rem; background: #fafbfc;
      resize: vertical; min-height: 100px;
    }
    .country-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    @media (max-width:400px) {
      .country-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .country-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 6px;
      border: 1px solid var(--borderStrong);
      border-radius: 8px;
      font-size: 0.78rem;
      background: #fff;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      white-space: nowrap;
    }
    .country-item:hover {
      border-color: var(--accent);
      background: var(--accentLight);
    }
    .country-item.active {
      border-color: var(--accent);
      background: var(--accentLight);
      font-weight: 600;
      box-shadow: 0 0 0 2px rgba(43,108,176,0.2);
    }
    .country-item .check-box {
      width: 18px;
      height: 18px;
      border: 2px solid var(--borderStrong);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--accent);
      transition: 0.1s;
      flex-shrink: 0;
    }
    .country-item.active .check-box {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .country-item.active .check-box::after {
      content: "✓";
      font-weight: bold;
    }

    .paper-wrap { width:100%; max-width:950px; }
    .paper {
      background:white; box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-radius:4px;
      padding:32px 28px; border:1px solid #e8e8e8;
    }
    .paper-header { text-align:center; margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid #f0f0f0; }
    .paper-header .title { font-size:1.4rem; font-weight:700; letter-spacing:1px; }
    .paper-header .sub { font-size:0.8rem; color:var(--muted); }
    .itinerary-table {
      width:100%; border-collapse: collapse; font-size: 0.78rem; table-layout: fixed;
      border: 1px solid #000;
    }
    .itinerary-table th {
      background: #f5f5f5; font-weight:700; font-size:0.72rem;
      border: 1px solid #333; padding: 8px 6px; text-align: center; color: #1a202c;
    }
    .itinerary-table td {
      border: 1px solid #555; padding: 8px 6px; vertical-align: top; word-break: break-word;
    }
    .col-seq { width:8%; text-align:center; }
    .col-date { width:12%; text-align:center; }
    .col-city { width:10%; text-align:center; }
    .col-spot { width:38%; }
    .col-acc { width:17%; }
    .col-trans { width:15%; }
    .transit-note { background:#f9f9f9; text-align:center; }
    .mark { background:#fff3cd; padding:2px 6px; border-radius:4px; font-size:0.7rem; display:inline-block; margin:1px 0; }
    .paper-footer { text-align:center; color:#cbd5e0; font-size:0.65rem; margin-top:20px; }
    .loading-overlay {
      display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(255,255,255,0.85);
      z-index:999; justify-content:center; align-items:center; font-size:1.2rem; color:var(--accent);
    }
    .loading-overlay.active { display:flex; }
    @media print {
      body { background:white; }
      .app-header, .input-area, .no-print, .loading-overlay { display:none!important; }
      .main-layout { display:block; padding:0; }
      .paper { box-shadow:none; border:none; padding:10px 0; }
      .itinerary-table { font-size:0.7rem; }
    }
  </style>
</head>
<body>
  <header class="app-header no-print">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div><h1>AI签证行程单</h1><span>中英双语 · 申根适配</span></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" onclick="resetAll()">🔄 清空</button>
      <button class="btn btn-primary btn-sm" onclick="generateItinerary()">✨ AI生成行程</button>
      <button class="btn btn-outline btn-sm" id="langToggleBtn" onclick="toggleLanguage()">🌐 转换为英文版</button>
      <button class="btn btn-success btn-sm" onclick="exportPDF()">📄 导出PDF</button>
      <button class="btn btn-outline btn-sm" onclick="exportWord()">📝 导出Word</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="input-area no-print">
      <h3>🧳 行程信息</h3>
      <div class="form-row">
        <label>🌍 选择想去的国家（可多选，一行三个）</label>
        <div class="country-grid" id="countryList"></div>
      </div>
      <div class="form-row">
        <label>💬 告诉我你的旅行计划</label>
        <textarea id="travelPlan" placeholder="例如：
我想在2026年4月24日到5月2日去欧洲旅游，从成都出发，飞罗马。回程从巴黎飞回成都。航班号是CA939和CA940。想住舒适的酒店，主要坐火车和飞机。想去五渔村、比萨斜塔，行程不要太赶。">我想在2026年4月24日到5月2日去欧洲旅游，从成都出发，飞罗马。回程从巴黎飞回成都。航班号是CA939和CA940。想住舒适的酒店，主要坐火车和飞机。想去五渔村、比萨斜塔，行程不要太赶。</textarea>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:6px;" onclick="generateItinerary()">
        🤖 AI 帮你规划行程
      </button>
      <button class="btn btn-outline" style="width:100%;margin-top:8px;" id="langToggleBtn2" onclick="toggleLanguage()">
        🌐 转换为英文版
      </button>
      <p style="font-size:0.7rem;color:var(--muted);margin-top:8px;">* AI 会根据你选的国家和描述，自动生成完整行程表格</p>
    </div>

    <div class="preview-area">
      <div class="paper-wrap">
        <div class="paper" id="itineraryPaper">
          <div style="text-align:center;padding:60px 20px;color:#a0aec0;">
            <div style="font-size:3rem;">📋</div>
            <p>选择国家、填写旅行计划后，点击“AI帮你规划行程”</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <span>🤖 AI正在帮你规划行程，请稍后...</span>
  </div>

  <script>
  (function() {
    const API_URL = 'https://visa-app-five.vercel.app/api/generate';

    // 申根国家列表（已去除列支敦士登）
    const schengenCountries = [
      '奥地利', '比利时', '捷克', '丹麦', '爱沙尼亚', '芬兰',
      '法国', '德国', '希腊', '匈牙利', '冰岛', '意大利',
      '拉脱维亚', '立陶宛', '卢森堡', '马耳他',
      '荷兰', '挪威', '波兰', '葡萄牙', '斯洛伐克', '斯洛文尼亚',
      '西班牙', '瑞典', '瑞士', '克罗地亚'
    ];

    // 交通翻译
    const transportZhEn = {
      '飞机':'flight','火车':'train','地铁':'metro','公交':'bus',
      '步行':'walk','出租车':'taxi','水上巴士':'water bus'
    };

    let itineraryResult = null;
    let currentLanguage = 'zh';

    function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('active', show); }
    function esc(s) {
      if (!s) return '';
      const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
    }

    // 构建国家多选列表
    function buildCountryList() {
      const container = document.getElementById('countryList');
      container.innerHTML = '';
      schengenCountries.forEach(country => {
        const div = document.createElement('div');
        div.className = 'country-item';
        div.dataset.country = country;
        div.innerHTML = `<span class="check-box"></span>${country}`;
        div.addEventListener('click', () => div.classList.toggle('active'));
        container.appendChild(div);
      });
      // 默认选中意大利、法国、瑞士
      ['意大利', '法国', '瑞士'].forEach(c => {
        const item = container.querySelector(`[data-country="${c}"]`);
        if (item) item.classList.add('active');
      });
    }

    function getSelectedCountries() {
      const actives = document.querySelectorAll('.country-item.active');
      return Array.from(actives).map(el => el.dataset.country);
    }

    // 生成行程
    async function generateItinerary() {
      const selectedCountries = getSelectedCountries();
      if (selectedCountries.length === 0) {
        showToast('❌ 请至少选择一个国家');
        return;
      }

      const travelPlan = document.getElementById('travelPlan').value.trim();
      if (!travelPlan) {
        showToast('❌ 请填写旅行计划描述');
        return;
      }

      // 拼接发送给AI的消息
      const message = `我想去以下国家旅游：${selectedCountries.join('、')}。\n我的旅行计划是：${travelPlan}\n\n请帮我规划一份签证行程单，包含每天的序号、日期、城市、旅游景点、住宿酒店、交通方式。要求行程合理，张弛有度。`;

      showLoading(true);
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 90000);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `请求失败 (状态码: ${response.status})`);
        }

        const result = await response.json();
        if (!result.days || !Array.isArray(result.days)) {
          throw new Error('AI 返回的数据格式不正确');
        }

        itineraryResult = result;
        currentLanguage = 'zh';
        updateLangButtons();
        renderItinerary(itineraryResult, currentLanguage);
        saveToLocal();
        showToast('✅ AI行程已生成');

      } catch (e) {
        clearTimeout(timeoutId);
        if (e.name === 'AbortError') {
          showToast('❌ AI 响应超时，可尝试减少国家数量或稍后重试');
        } else {
          showToast('❌ ' + e.message);
        }
        console.error(e);
      }
      showLoading(false);
    }

    // 渲染表格
    function renderItinerary(data, lang) {
      const paper = document.getElementById('itineraryPaper');
      if (!data || !data.days) return;
      const zh = (lang === 'zh');

      let html = `<div class="paper-header">
        <div class="title">${zh ? '🗺️ 旅行行程单 · Travel Itinerary' : '🗺️ Travel Itinerary'}</div>
        <div class="sub">${zh ? 'AI 智能规划 · 申根签证专用' : 'AI Powered · Schengen Visa'}</div>
      </div><table class="itinerary-table">
        <thead><tr>
          <th class="col-seq">${zh ? '序号' : 'No.'}</th>
          <th class="col-date">${zh ? '日期' : 'Date'}</th>
          <th class="col-city">${zh ? '城市' : 'City'}</th>
          <th class="col-spot">${zh ? '旅游景点' : 'Scenic Spots'}</th>
          <th class="col-acc">${zh ? '住宿' : 'Accommodation'}</th>
          <th class="col-trans">${zh ? '交通' : 'Transport'}</th>
        </tr></thead><tbody>`;

      data.days.forEach((day, idx) => {
        if (day.transitNote && day.transitNote.trim()) {
          html += `<tr class="transit-note"><td colspan="6">🚄 ${esc(day.transitNote)}</td></tr>`;
        }

        let spotsHtml = '';
        if (day.arrivalInfo && day.arrivalInfo.trim()) spotsHtml += `<div style="margin-bottom:6px;">${esc(day.arrivalInfo)}</div>`;
        (day.attractions || []).forEach((a, i) => {
          if (zh) spotsHtml += `${i+1}. ${esc(a.name)} (${esc(a.nameEn||'')}) <span class="mark">${esc(a.time||'')}</span><br>`;
          else spotsHtml += `${i+1}. ${esc(a.nameEn||a.name)} <span class="mark">${esc(a.time||'')}</span><br>`;
        });
        if (day.departureInfo && day.departureInfo.trim()) spotsHtml += `<div style="margin-top:6px;">${esc(day.departureInfo)}</div>`;

        let transportStr = '';
        if (day.transport && Array.isArray(day.transport)) {
          transportStr = day.transport.map(t => zh ? t : (transportZhEn[t]||t)).join(', ');
        }

        html += `<tr>
          <td class="col-seq">${day.day || idx+1}</td>
          <td class="col-date">${esc(day.date||'')}</td>
          <td class="col-city"><strong>${esc(day.city||'')}</strong></td>
          <td class="col-spot">${spotsHtml}</td>
          <td class="col-acc"><strong>${esc(day.hotel||'')}</strong></td>
          <td class="col-trans">${transportStr}</td>
        </tr>`;
      });

      html += `</tbody></table><div class="paper-footer">${zh ? 'AI 生成 · 仅供参考 · 请核对后递签' : 'AI generated · for reference only'}</div>`;
      paper.innerHTML = html;
    }

    function toggleLanguage() {
      if (!itineraryResult) { showToast('请先生成行程'); return; }
      currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
      updateLangButtons();
      renderItinerary(itineraryResult, currentLanguage);
    }

    function updateLangButtons() {
      const text = currentLanguage === 'zh' ? '🌐 转换为英文版' : '🌐 转换为中文版';
      document.querySelectorAll('#langToggleBtn, #langToggleBtn2').forEach(b => b.textContent = text);
    }

    function saveToLocal() {
      try { localStorage.setItem('ai_itinerary_bilingual', JSON.stringify(itineraryResult)); } catch(e) {}
    }

    function loadFromLocal() {
      try {
        const saved = localStorage.getItem('ai_itinerary_bilingual');
        if (saved) {
          itineraryResult = JSON.parse(saved);
          renderItinerary(itineraryResult, 'zh');
          currentLanguage = 'zh';
          updateLangButtons();
        }
      } catch(e) {}
    }

    function exportPDF() {
      alert('请使用浏览器打印功能，选择“另存为PDF”，边距设为最小。');
      window.print();
    }

    function exportWord() {
      if (!itineraryResult) { showToast('请先生成行程'); return; }
      const paperHTML = document.getElementById('itineraryPaper').outerHTML;
      const full = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>签证行程单</title><style>body{font-family:sans-serif;max-width:950px;margin:0 auto;padding:20px;} table{border-collapse:collapse;width:100%;border:1px solid #000;} th,td{border:1px solid #333;padding:8px;} .mark{background:#fff3cd;}</style></head><body>${paperHTML}</body></html>`;
      const blob = new Blob([full], { type: 'application/msword' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '签证行程单.doc'; a.click();
      showToast('📝 Word文档已下载');
    }

    function resetAll() {
      document.getElementById('travelPlan').value = '我想在2026年4月24日到5月2日去欧洲旅游，从成都出发，飞罗马。回程从巴黎飞回成都。航班号是CA939和CA940。想住舒适的酒店，主要坐火车和飞机。想去五渔村、比萨斜塔，行程不要太赶。';
      itineraryResult = null;
      currentLanguage = 'zh';
      updateLangButtons();
      document.querySelectorAll('.country-item').forEach(el => el.classList.remove('active'));
      ['意大利', '法国', '瑞士'].forEach(c => {
        const item = document.querySelector(`.country-item[data-country="${c}"]`);
        if (item) item.classList.add('active');
      });
      document.getElementById('itineraryPaper').innerHTML = `<div style="text-align:center;padding:60px;"><div style="font-size:3rem;">📋</div><p>选择国家、填写旅行计划后，点击“AI帮你规划行程”</p></div>`;
      showToast('🔄 已重置');
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.position='fixed'; t.style.bottom='24px'; t.style.left='50%';
      t.style.transform='translateX(-50%)'; t.style.background='#1a202c'; t.style.color='white';
      t.style.padding='10px 24px'; t.style.borderRadius='30px'; t.style.zIndex='1000'; t.style.fontSize='0.85rem';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    window.generateItinerary = generateItinerary;
    window.toggleLanguage = toggleLanguage;
    window.exportPDF = exportPDF;
    window.exportWord = exportWord;
    window.resetAll = resetAll;

    buildCountryList();
    loadFromLocal();
  })();
  </script>
</body>
</html>
